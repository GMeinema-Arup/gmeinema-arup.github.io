bridge_engineering:
  - title: "Haringvliet Bridge Replacement"
    org: "Arup Amsterdam"
    year: 2026
    location: "Rotterdam, The Netherlands"
    description: "Conducted archival research of historical drawings, developed substructure models, and performed option evaluations to help identify a preferred replacement strategy."
    image: "images/projects/HVB.jpg"
  - title: "Parkhaven Bridge Design"
    org: "TU Delft"
    year: 2024
    location: "Rotterdam, The Netherlands"
    description: "Designed a new pedestrian and cycling bridge over the Parkhaven in Rotterdam. The project involved site and context analyses, comparison of bridge concepts, and creating a final design proposal."
    image: "images/projects/Parkhaven.jpg"
  - title: "Master Thesis"
    org: "TU Delft"
    year: 2025
    location: "Delft, The Netherlands"
    description: "Investigated the assessment and strengthening of prestressed concrete T-girders, focusing on residual capacity and life extension strategies."
    image: "images/projects/Arup_Black_RGB.png"
  - title: "ARP"
    org: "Arup Amsterdam"
    year: 2025
    location: "Amsterdam, The Netherlands"
    description: "Developed the reference calculation for prefab infill girders as the technical basis for an automated bridge assessment procedure."
    image: "images/projects/Arup_Black_RGB.png"

